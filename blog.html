---
layout: default
title: Blog
---

<style>
.blog-list {
    max-width: 800px;
    margin: 0 auto;
    padding: 2em 1em;
}

.blog-list h1 {
    font-size: 2.5em;
    margin-bottom: 1em;
}

.post-item {
    margin-bottom: 2em;
    padding-bottom: 1.5em;
    border-bottom: 1px solid #E8E8E8;
}

.post-item:last-child {
    border-bottom: none;
}

.post-title {
    font-size: 1.8em;
    margin-bottom: 0.3em;
}

.post-title a {
    color: #333;
    text-decoration: none;
}

.post-title a:hover {
    text-decoration: underline;
}

.post-date {
    color: #666;
    font-size: 0.9em;
    margin-bottom: 0.5em;
    display: block;
}

.post-excerpt {
    color: #555;
    line-height: 1.6;
}

.read-more {
    color: #333;
    font-weight: 500;
}

.read-more:hover {
    text-decoration: underline;
}
</style>

<div class="blog-list">
    <h1>Blog</h1>

    {% for post in site.posts %}
    <div class="post-item">
        <h2 class="post-title">
            <a href="{{ post.url }}">{{ post.title }}</a>
        </h2>
        <span class="post-date">{{ post.date | date: "%B %d, %Y" }}</span>

        {% if post.excerpt %}
        <div class="post-excerpt">
            {{ post.excerpt | strip_html | truncate: 250 }}
            <a href="{{ post.url }}" class="read-more">Read more &rarr;</a>
        </div>
        {% endif %}
    </div>
    {% endfor %}
</div>
