<!-- SEO and Social Media Meta Tags - Privacy-Friendly (No Tracking) -->

<!-- Basic SEO -->
<meta name="author" content="{{ site.author }}">
{% if page.tags %}
<meta name="keywords" content="{{ page.tags | join: ', ' }}">
{% endif %}

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}">
<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 200 }}{% else %}{{ site.description }}{% endif %}">
<meta name="twitter:site" content="@arelangi">
<meta name="twitter:creator" content="@arelangi">

<!-- Canonical URL (prevents duplicate content issues) -->
<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<!-- Structured Data (JSON-LD) for Search Engines -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{% if page.layout == 'post' %}BlogPosting{% else %}WebSite{% endif %}",
  "headline": "{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}",
  "description": "{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 200 }}{% else %}{{ site.description }}{% endif %}",
  "url": "{{ site.url }}{{ page.url }}",
  {% if page.layout == 'post' %}
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  {% endif %}
  "author": {
    "@type": "Person",
    "name": "{{ site.author }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ site.author }}"
  }
}
</script>
