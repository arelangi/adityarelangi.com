---
layout: default
title: Tags
---

<div class="blog-list">
    <h1>Browse by Tag</h1>

    {% assign sorted_tags = site.tags | sort %}
    {% for tag in sorted_tags %}
    <section class="tag-section">
        <h2 class="tag-heading" id="{{ tag[0] | slugify }}">
            {{ tag[0] }}
            <span class="tag-count">({{ tag[1] | size }})</span>
        </h2>

        <div class="tag-posts">
            {% for post in tag[1] %}
            <article class="tag-post-item">
                <a href="{{ post.url }}" class="tag-post-link">
                    {{ post.title }}
                </a>
                <time class="tag-post-date">{{ post.date | date: "%b %d, %Y" }}</time>
            </article>
            {% endfor %}
        </div>
    </section>
    {% endfor %}
</div>

<style>
.tag-section {
    margin-bottom: 3rem;
}

.tag-heading {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--color-border);
    color: var(--color-text);
}

.tag-count {
    font-size: 0.9rem;
    color: var(--color-text-light);
    font-weight: 400;
}

.tag-posts {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.tag-post-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
}

.tag-post-link {
    color: var(--color-text);
    text-decoration: none;
    flex: 1;
}

.tag-post-link:hover {
    color: var(--color-accent);
}

.tag-post-date {
    color: var(--color-text-light);
    font-size: 0.9rem;
    white-space: nowrap;
}

@media (max-width: 768px) {
    .tag-post-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
    }
}
</style>
